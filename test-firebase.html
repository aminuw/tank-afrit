<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }

        .test-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .success {
            color: #4CAF50;
            font-weight: bold;
        }

        .error {
            color: #FF5722;
            font-weight: bold;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #45a049;
        }

        #log {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>🔥 Test Firebase - Tank Battle Royale</h1>

    <div class="test-box">
        <h2>1. Connexion Firebase</h2>
        <p id="firebase-status">⏳ En attente...</p>
    </div>

    <div class="test-box">
        <h2>2. Tests de base</h2>
        <button onclick="testCreateGame()">Créer une partie test</button>
        <button onclick="testJoinGame()">Rejoindre partie test</button>
        <button onclick="testWriteData()">Écrire des données</button>
        <button onclick="testReadData()">Lire des données</button>
        <p id="test-result"></p>
    </div>

    <div class="test-box">
        <h2>3. Log</h2>
        <div id="log"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <script>
        const log = document.getElementById('log');
        const statusEl = document.getElementById('firebase-status');
        const resultEl = document.getElementById('test-result');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4CAF50' : type === 'error' ? '#FF5722' : '#FFF';
            log.innerHTML += `<div style="color: ${color}">[${time}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // Test de connexion Firebase
        window.addEventListener('load', () => {
            addLog('🚀 Démarrage du test Firebase...');

            if (typeof firebase === 'undefined') {
                statusEl.innerHTML = '<span class="error">❌ Firebase SDK non chargé</span>';
                addLog('❌ Firebase SDK non chargé', 'error');
                return;
            }

            addLog('✅ Firebase SDK chargé');

            // Initialiser Firebase
            const success = initFirebase();

            if (success) {
                statusEl.innerHTML = '<span class="success">✅ Firebase connecté !</span>';
                addLog('✅ Firebase initialisé avec succès', 'success');
                addLog(`📊 Database URL: ${firebaseConfig.databaseURL}`, 'success');
                addLog(`🎮 Projet: ${firebaseConfig.projectId}`, 'success');
            } else {
                statusEl.innerHTML = '<span class="error">❌ Erreur de connexion</span>';
                addLog('❌ Erreur lors de l\'initialisation Firebase', 'error');
            }
        });

        // Test créer une partie
        async function testCreateGame() {
            addLog('🎮 Test: Création d\'une partie...');
            resultEl.textContent = '⏳ Création en cours...';

            try {
                const result = await createGame('TestPlayer', { color: '#FF0000', color2: '#AA0000' });
                if (result) {
                    addLog(`✅ Partie créée ! Code: ${result.gameCode}`, 'success');
                    resultEl.innerHTML = `<span class="success">✅ Partie créée ! Code: ${result.gameCode}</span>`;
                }
            } catch (error) {
                addLog(`❌ Erreur: ${error.message}`, 'error');
                resultEl.innerHTML = `<span class="error">❌ ${error.message}</span>`;
            }
        }

        // Test rejoindre une partie
        async function testJoinGame() {
            const code = prompt('Entrez le code de la partie:');
            if (!code) return;

            addLog(`🚀 Test: Rejoindre la partie ${code}...`);
            resultEl.textContent = '⏳ Connexion en cours...';

            try {
                const result = await joinGame(code.toUpperCase(), 'TestPlayer2', { color: '#0000FF', color2: '#0000AA' });
                addLog(`✅ Partie rejointe ! Code: ${result.gameCode}`, 'success');
                resultEl.innerHTML = `<span class="success">✅ Partie rejointe !</span>`;
            } catch (error) {
                addLog(`❌ Erreur: ${error.message}`, 'error');
                resultEl.innerHTML = `<span class="error">❌ ${error.message}</span>`;
            }
        }

        // Test écrire des données
        async function testWriteData() {
            addLog('📝 Test: Écriture de données...');
            resultEl.textContent = '⏳ Écriture en cours...';

            try {
                await database.ref('test/message').set({
                    text: 'Hello Firebase!',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                addLog('✅ Données écrites avec succès', 'success');
                resultEl.innerHTML = '<span class="success">✅ Données écrites !</span>';
            } catch (error) {
                addLog(`❌ Erreur: ${error.message}`, 'error');
                resultEl.innerHTML = `<span class="error">❌ ${error.message}</span>`;
            }
        }

        // Test lire des données
        async function testReadData() {
            addLog('📖 Test: Lecture de données...');
            resultEl.textContent = '⏳ Lecture en cours...';

            try {
                const snapshot = await database.ref('test/message').once('value');
                const data = snapshot.val();

                if (data) {
                    addLog(`✅ Données lues: ${JSON.stringify(data)}`, 'success');
                    resultEl.innerHTML = `<span class="success">✅ Données: ${data.text}</span>`;
                } else {
                    addLog('⚠️ Aucune donnée trouvée', 'error');
                    resultEl.innerHTML = '<span class="error">⚠️ Aucune donnée</span>';
                }
            } catch (error) {
                addLog(`❌ Erreur: ${error.message}`, 'error');
                resultEl.innerHTML = `<span class="error">❌ ${error.message}</span>`;
            }
        }
    </script>
</body>

</html>
